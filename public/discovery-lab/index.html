<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Discovery Lab | A discovery simulation by Alejandra Castillo</title>
<meta name="description" content="A branching, bilingual discovery-call simulation for B2B SaaS sellers. Fictional portfolio case designed by Alejandra Castillo, Senior Learning Experience Designer." />
<meta property="og:title" content="The Discovery Lab | Alejandra Castillo" />
<meta property="og:description" content="Discover what really matters: a branching discovery-call simulation for B2B SaaS sellers." />
<meta name="theme-color" content="#10162B" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --navy:#10162B; --purple:#6251B5; --purple-dark:#4E3F99; --mint:#67DED2; --lavender:#E9E3FF;
  --cloud:#F7F8FC; --teal:#006E72; --ink:#17213A; --ink-2:#53627B; --line:#DCE0EC; --white:#FFFFFF;
  --radius:18px; --shadow:0 6px 24px rgba(16,22,43,.08);
  --f-head:"Manrope",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f-body);font-size:17px;line-height:1.6;color:var(--ink);background:var(--cloud);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-head);color:var(--ink);margin:0}
p{margin:0}
button{font:inherit;color:inherit}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:16px;top:-60px;z-index:100;background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:600}
.skip:focus{top:12px}
:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.dark :focus-visible{outline-color:var(--mint)}
.mono{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:12px 28px;border-radius:999px;border:2px solid transparent;font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;transition:transform .15s ease,background-color .15s ease,box-shadow .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn-mint{background:var(--mint);color:var(--navy)}
.btn-mint:hover{background:#86E6DC;box-shadow:0 8px 24px rgba(103,222,210,.35)}
.btn-purple{background:var(--purple);color:#fff}
.btn-purple:hover{background:var(--purple-dark)}
.btn-ghost{background:transparent;color:var(--purple);border-color:var(--purple)}
.btn-ghost:hover{background:var(--lavender)}
.btn svg{width:20px;height:20px}

/* ---------- Language toggle ---------- */
.lang{display:inline-flex;border-radius:999px;padding:3px;background:var(--lavender);gap:2px}
.lang button{min-width:44px;min-height:36px;border:0;border-radius:999px;background:transparent;font-family:var(--f-mono);font-size:13px;font-weight:500;letter-spacing:.06em;cursor:pointer;color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--purple);color:#fff}
.dark .lang{background:rgba(255,255,255,.1)}
.dark .lang button{color:#fff}
.dark .lang button[aria-pressed="true"]{background:var(--mint);color:var(--navy)}

/* ---------- Cover ---------- */
.cover{min-height:100vh;background:var(--navy);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column}
.cover::before,.cover::after{content:"";position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none}
.cover::before{width:520px;height:520px;background:rgba(98,81,181,.45);top:-160px;right:-120px}
.cover::after{width:380px;height:380px;background:rgba(103,222,210,.18);bottom:-140px;left:-80px}
.cover-top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:24px clamp(20px,5vw,64px)}
.cover-brand{font-family:var(--f-head);font-weight:700;font-size:16px;color:#fff;text-decoration:none}
.cover-brand span{color:var(--mint)}
.cover-main{position:relative;z-index:1;flex:1;display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;padding:24px clamp(20px,5vw,64px) 48px;max-width:1280px;margin:0 auto;width:100%}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(103,222,210,.14);color:var(--mint);border:1px solid rgba(103,222,210,.35)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--mint)}
.cover h1{color:#fff;font-size:clamp(40px,6vw,64px);font-weight:800;line-height:1.04;letter-spacing:-.02em;margin:22px 0 14px}
.cover .sub{font-family:var(--f-head);font-weight:700;font-size:clamp(22px,2.6vw,28px);color:var(--mint);margin-bottom:18px}
.cover .body{font-size:19px;color:#D5DAE8;max-width:34ch;margin-bottom:32px}
.cover .meta{margin-top:22px;font-size:14px;color:#B7BFD4;display:flex;flex-wrap:wrap;gap:6px 14px}
.cover-foot{position:relative;z-index:1;padding:20px clamp(20px,5vw,64px);font-size:14px;color:#B7BFD4;border-top:1px solid rgba(255,255,255,.08)}
.cover-foot a{color:var(--mint)}
.cover-art svg{width:100%;height:auto;max-width:560px;display:block;margin-left:auto}

/* ---------- App shell ---------- */
.app-header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.app-header-inner{max-width:1240px;margin:0 auto;padding:10px clamp(16px,3vw,32px);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.app-brand{font-family:var(--f-head);font-weight:800;font-size:17px;color:var(--navy);margin-right:auto;text-decoration:none}
.app-brand span{color:var(--purple)}
.progress{flex-basis:100%;order:3;display:flex;flex-direction:column;gap:6px;padding-bottom:4px}
.progress-label{color:var(--ink-2)}
.progress-bar{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.progress-bar span{height:6px;border-radius:999px;background:var(--line)}
.progress-bar span.done{background:var(--purple)}
.progress-bar span.now{background:var(--mint);box-shadow:inset 0 0 0 1px var(--teal)}
.hdr-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:4px 12px 4px 6px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink)}
.switch .track{width:38px;height:22px;border-radius:999px;background:#B9C0D3;position:relative;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"] .track{background:var(--purple)}
.switch[aria-checked="true"] .track::after{transform:translateX(16px)}
.icon-btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 14px;border:1px solid var(--line);background:#fff;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}

main.stage{max-width:1240px;margin:0 auto;padding:28px clamp(16px,3vw,32px) 64px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
main.stage.single{grid-template-columns:minmax(0,1fr)}
.col{min-width:0;display:flex;flex-direction:column;gap:22px}
.scene-head{display:flex;flex-direction:column;gap:10px}
.eyebrow{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#C9F3EE;color:var(--navy)}
.scene-head h1{font-size:clamp(28px,3.4vw,36px);font-weight:700;line-height:1.15;letter-spacing:-.01em}
.scene-head h1:focus{outline:none}
.scene-head h1:focus-visible{outline:3px solid var(--purple);outline-offset:4px;border-radius:6px}
.lead{color:var(--ink-2);font-size:17px;max-width:62ch}

.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid #EDEFF5}
.designer-note{border-radius:var(--radius);background:#fff;border:2px dashed var(--purple);padding:18px 20px;display:flex;gap:14px}
.designer-note svg{flex:none;width:28px;height:28px;color:var(--purple)}
.designer-note h2{font-size:16px;margin-bottom:4px;color:var(--purple)}
.designer-note p{font-size:15px;color:var(--ink)}

/* Briefing */
.brief-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.prospect{padding:22px;display:flex;flex-direction:column;gap:14px;background:var(--navy);color:#fff;border:0}
.prospect .who{display:flex;gap:14px;align-items:center}
.avatar{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--purple);font-family:var(--f-head);font-weight:800;font-size:18px;box-shadow:0 0 0 4px rgba(205,189,255,.45)}
.prospect h2{color:#fff;font-size:22px}
.prospect .role{color:#D5DAE8;font-size:15px}
.prospect .co{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.07);font-size:15px;color:#E6E9F2}
.prospect .co svg{flex:none;width:40px;height:40px}
.info{padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.info h2{font-size:18px;display:flex;align-items:center;gap:10px}
.info h2 .ic{width:34px;height:34px;border-radius:10px;background:var(--lavender);display:grid;place-items:center;color:var(--purple)}
.info h2 .ic svg{width:18px;height:18px}
.info p{color:var(--ink-2);font-size:16px}
.objective{border-left:5px solid var(--teal)}

/* Call card */
.call{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center;padding:14px;background:var(--navy);border-radius:var(--radius);color:#fff}
.call .tile{border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:#2A2F55}
.call .tile svg{width:100%;height:100%;display:block}
.call .live{display:inline-flex;align-items:center;gap:8px;color:var(--mint)}
.call .live .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);animation:pulse 1.6s infinite}
.call h2{color:#fff;font-size:20px;margin:6px 0 2px}
.call .role{color:#C9CFE0;font-size:15px}
.mood{margin-top:10px;display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-size:14px;color:#fff}
.mood b{font-weight:600;color:var(--mint)}

/* Transcript */
.transcript{display:flex;flex-direction:column;gap:14px;padding:22px;background:#fff}
.transcript h2{font-size:15px}
details.earlier{border-bottom:1px dashed var(--line);padding-bottom:10px}
details.earlier summary{cursor:pointer;color:var(--purple);font-weight:600;font-size:15px;min-height:44px;display:flex;align-items:center}
details.earlier .msgs{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.msg{display:flex;gap:12px;align-items:flex-end;max-width:88%}
.msg .ava{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-head);font-weight:800;font-size:13px}
.msg.morgan .ava{background:var(--lavender);color:var(--purple)}
.msg.you{align-self:flex-end;flex-direction:row-reverse}
.msg.you .ava{background:var(--purple);color:#fff}
.bubble{padding:12px 16px;border-radius:18px;font-size:18px;line-height:1.6}
.bubble .name{display:block;font-size:13px;font-weight:600;margin-bottom:2px}
.msg.morgan .bubble{background:var(--cloud);border:1px solid #E3E6F0;border-bottom-left-radius:6px}
.msg.morgan .bubble .name{color:var(--teal)}
.msg.you .bubble{background:var(--purple);color:#fff;border-bottom-right-radius:6px}
.msg.you .bubble .name{color:#E9E3FF}
.msg:focus{outline:none}
.msg:focus-visible .bubble{outline:3px solid var(--purple);outline-offset:3px}
.narr{align-self:center;text-align:center;font-size:15px;font-style:italic;color:var(--ink-2);max-width:56ch;padding:4px 12px}
.msg.new,.narr.new{animation:rise .45s ease both}
.msg.morgan.new{animation-delay:.35s}

/* Choices */
.choices{padding:22px;display:flex;flex-direction:column;gap:14px}
.choices fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.choices legend{font-family:var(--f-head);font-weight:700;font-size:20px;margin-bottom:4px;padding:0}
.choices .hint{font-size:14px;color:var(--ink-2);font-weight:500}
.opt{position:relative;display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:16px;border:2px solid #E3E6F0;background:#fff;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.opt:hover{border-color:#B8ADEB;transform:translateY(-1px)}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt .oic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--lavender);display:grid;place-items:center;color:var(--purple)}
.opt .oic svg{width:22px;height:22px}
.opt .txt{flex:1;font-size:17px}
.opt .radio{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #8C97AE;margin-top:10px;display:grid;place-items:center}
.opt input:checked ~ .radio{border-color:var(--purple)}
.opt input:checked ~ .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--purple)}
.opt:has(input:checked){border-color:var(--purple);box-shadow:0 0 0 4px rgba(98,81,181,.14)}
.opt:has(input:focus-visible){outline:3px solid var(--purple);outline-offset:3px}
.opt.chk .radio{border-radius:6px}
.opt.chk input:checked ~ .radio::after{width:14px;height:8px;border-radius:0;background:transparent;border-left:3px solid var(--purple);border-bottom:3px solid var(--purple);transform:rotate(-45deg) translate(1px,-2px)}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.err{color:#A3263A;font-weight:600;font-size:15px}

/* Notes aside */
.aside{position:sticky;top:120px;display:flex;flex-direction:column;gap:16px}
.notes{background:var(--lavender);border-radius:var(--radius);padding:20px}
.notes h2{display:flex;align-items:center;gap:10px;color:var(--purple);margin-bottom:12px}
.notes h2 svg{width:20px;height:20px}
.notes ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.notes li{background:#fff;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5;display:flex;gap:10px;border-left:4px solid var(--teal)}
.notes li svg{flex:none;width:18px;height:18px;color:var(--teal);margin-top:2px}
.notes li.new{animation:slide .5s ease both, glow 1.6s ease .5s 1}
.notes .empty{font-size:15px;color:var(--ink-2)}
.notes-mobile{display:none}

/* Evidence board */
.board-art{display:flex;gap:18px;align-items:center}
.board-art svg{flex:none;width:150px;height:auto}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.legend div{background:#fff;border-radius:14px;padding:12px 14px;font-size:14px;border-top:4px solid}
.legend b{display:block;font-size:15px}
.legend .k{border-color:var(--teal)} .legend .a{border-color:var(--purple)} .legend .s{border-color:var(--ink-2)}
.ev-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ev{padding:18px;display:flex;flex-direction:column;gap:12px}
.ev fieldset{border:0;padding:0;margin:0;min-width:0}
.ev legend{font-size:17px;font-weight:600;color:var(--ink);padding:0;margin-bottom:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border-radius:999px;border:2px solid #D4D9E6;font-size:14px;font-weight:600;cursor:pointer;background:#fff}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label:has(input:checked){background:var(--purple);border-color:var(--purple);color:#fff}
.seg label:has(input:focus-visible){outline:3px solid var(--purple);outline-offset:3px}
.seg label:has(input:disabled){cursor:default}
.verdict{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:15px;line-height:1.5}
.verdict svg{flex:none;width:20px;height:20px;margin-top:2px}
.verdict.ok{background:#E2F4F2;color:#00494C}
.verdict.no{background:var(--lavender);color:#3B2F7A}
.verdict b{display:block}
.counter{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600}
.counter b{display:grid;place-items:center;min-width:26px;height:26px;border-radius:50%;background:var(--purple);color:#fff;font-size:13px}
.summary-line{padding:16px 18px;border-radius:14px;background:var(--navy);color:#fff;font-weight:600}

/* Debrief */
.debrief-hero{display:grid;grid-template-columns:1fr 220px;gap:20px;align-items:center;padding:26px;background:var(--navy);border-radius:var(--radius);color:#fff}
.debrief-hero h1{color:#fff}
.debrief-hero p{color:#D5DAE8}
.debrief-hero svg{width:100%;height:auto}
.path{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.path span{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-size:14px;color:#fff}
.path span i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--mint)}
.dims{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dim{padding:22px;display:flex;flex-direction:column;gap:12px}
.dim-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dim h2{font-size:19px}
.level{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px}
.level svg{width:18px;height:18px}
.level.l2{background:#E2F4F2;color:#00494C}
.level.l1{background:var(--lavender);color:#3B2F7A}
.level.l0{background:#EEF0F5;color:#3D4A61}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.meter span{height:8px;border-radius:999px;background:#E3E6F0}
.meter.l2 span{background:var(--teal)}
.meter.l1 span:nth-child(-n+2){background:var(--purple)}
.meter.l0 span:first-child{background:var(--ink-2)}
.dim .ev-text{font-size:16px}
.try{border-radius:12px;background:var(--cloud);padding:12px 14px;font-size:15px}
.try b{display:block;color:var(--teal);font-size:13px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.closing{text-align:center;padding:30px 22px;border-radius:var(--radius);background:var(--purple);color:#fff;display:flex;flex-direction:column;gap:18px;align-items:center}
.closing p{font-family:var(--f-head);font-weight:700;font-size:clamp(20px,2.4vw,26px);max-width:30ch}
.closing .btn-ghost{color:#fff;border-color:#fff}
.closing .btn-ghost:hover{background:rgba(255,255,255,.12)}
.disclaim{font-size:14px;color:var(--ink-2);text-align:center}
.disclaim a{color:var(--purple)}

dialog{border:0;border-radius:var(--radius);padding:26px;max-width:420px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(16,22,43,.3)}
dialog::backdrop{background:rgba(16,22,43,.55)}
dialog h2{font-size:20px;margin-bottom:8px}
dialog p{color:var(--ink-2);margin-bottom:20px}

.fade{animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(103,222,210,.0)}40%{box-shadow:0 0 0 6px rgba(103,222,210,.55)}100%{box-shadow:0 0 0 0 rgba(103,222,210,0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.floaty{animation:float 5s ease-in-out infinite}
.floaty.d2{animation-delay:-2.5s}

@media (max-width:980px){
  main.stage{grid-template-columns:minmax(0,1fr)}
  .aside{display:none}
  .notes-mobile{display:block}
  .notes-mobile summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:48px;font-weight:600;color:var(--purple)}
  .notes-mobile summary::-webkit-details-marker{display:none}
  .cover-main{grid-template-columns:1fr}
  .cover-art{order:-1}
  .cover-art svg{max-width:420px;margin:0 auto}
}
@media (max-width:720px){
  body{font-size:16px}
  .brief-grid,.ev-grid,.dims,.legend{grid-template-columns:1fr}
  .call{grid-template-columns:120px 1fr;gap:12px}
  .bubble{font-size:17px}

  "The briefing gives just enough context to act, like a CRM record before a call. The objective is stated as a behavior, not a topic, so learners know what “good” looks like before they start.",

function announce(msg){

  if(S.notes.includes(key)) return;
  S.notes.push(key); S.newNote = key;

/* =========================================================
   Scoring (practice rubric)
   ========================================================= */
function cardState(id){
  const c = CARDS[id], revealed = c.flag && S.flags[c.flag];
  return { text: c[S.lang][revealed ? 0 : 1], expected: revealed ? "known" : c.hidden, why: revealed ? "r_known" : c.why };
}
function boardScore(){
  let matches = 0, firstAssumedAsKnown = null;
  Object.keys(CARDS).forEach(id=>{
    const st = cardState(id), pick = S.board[id];
    if(pick === st.expected) matches++;
    if(st.expected === "assumed" && pick === "known" && !firstAssumedAsKnown) firstAssumedAsKnown = st.text;
  });
  let level = matches >= 6 ? 2 : matches >= 4 ? 1 : 0;
  if(firstAssumedAsKnown) level = Math.min(level, 1);
  return {matches, level, firstAssumedAsKnown};
}

  out.push({lvl:c, text: c===2 ? D.clarify[2] : c===1 ? D.clarify[1](D.clarify.x[S.s1]) : D.clarify[0], tryQ:D.clarify.tryQ});
  // 2 Impact
  const f = S.flags;
  let i = f.business_impact ? 2 : (f.stakeholders || f.success_criteria) ? 1 : 0;
  const which = f.stakeholders && f.success_criteria ? "both" : f.stakeholders ? "stake" : "success";
  out.push({lvl:i, text: i===2 ? D.impact[2] : i===1 ? D.impact[1](D.impact.x[which]) : D.impact[0], tryQ:D.impact.tryQ});
  // 3 Uncertainty
  const b = boardScore();
  out.push({lvl:b.level, text: b.level===2 ? D.unc[2] : b.level===1 ? (b.firstAssumedAsKnown ? D.unc[1](b.firstAssumedAsKnown) : D.unc["1g"]) : D.unc[0], tryQ:D.unc.tryQ});
  // 4 Next step
  let n, txt; const st = strong();
  if(S.s4 === "A" || S.s4 === "C"){ n = 0; txt = D.next[0](D.next.x[S.s4]); }
  else if((S.s4 === "B" && st) || (S.s4 === "D" && !st)){
    if(S.justify.length){ n = 2; txt = D.next[2](NOTES[S.lang][S.justify[0]]); }
    else if(!S.notes.length){ n = 2; txt = D.next["2n"]; }
    else { n = 1; txt = D.next["2u"]; }
  } else { n = 1; txt = S.s4 === "B" ? D.next["1B"] : D.next["1D"]; }
  out.push({lvl:n, text:txt, tryQ:D.next.tryQ});
  return out;
}

function render(){
  document.documentElement.lang = S.lang;
  document.title = t("docTitle");
  const html = S.scene < 0 ? renderCover() : [renderBriefing,renderS1,renderS2,renderS3,renderS4,renderS5][S.scene]();
  document.getElementById("app").innerHTML = `<a class="skip" href="#main">${t("skip")}</a>` + html;
  S.newMsgs = 0; S.newNote = null;
  if(focusId){ const el = document.getElementById(focusId); if(el) el.focus({preventScroll:false}); focusId = null; }
}
function goScene(n){
  S.scene = n; window.scrollTo({top:0, behavior: reduce ? "auto" : "smooth"});
  focusId = "scene-title";
  render();
  if(n >= 0) announce(t("sceneAnn")(String(n).padStart(2,"0"), t("sceneNames")[n]));
}
function picked(name){ const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : null; }
function needPick(name){ const e = document.getElementById(name+"-err"); if(e){ e.hidden = false; } const first = document.querySelector(`input[name="${name}"]`); if(first) first.focus(); }

/* =========================================================
   Actions
   ========================================================= */
const act = {
  lang(v){ if(S.lang===v) return; S.lang = v; focusId = "lang-"+v; render(); announce(t("langNow")); },
  dn(){ S.dn = !S.dn; focusId = "dn-toggle"; render(); },
  start(){ goScene(0); },
  home(e){ if(e) e.preventDefault(); S = Object.assign(fresh(), {lang:S.lang, dn:S.dn}); goScene(-1); },
  restart(){ const d = document.getElementById("restart-dlg");
    document.getElementById("restart-title").textContent = t("restartTitle");
    document.getElementById("restart-body").textContent = t("restartBody");
    document.getElementById("restart-yes").textContent = t("restartYes");
    document.getElementById("restart-no").textContent = t("restartNo");
    d.showModal(); },
  replay(){ S = Object.assign(fresh(), {lang:S.lang, dn:S.dn}); S.phase = "choose"; S.scene = 1; say("morgan","m_open"); goScene(1); },
  join(){ S.phase = "choose"; S.mood = "engaged"; S.scene = 1; say("morgan","m_open"); goScene(1); },
  s1(){
    const v = picked("s1"); if(!v) return needPick("s1");
    S.s1 = v; say("you","s1_"+v);
    let last;
    if(v === "B"){ setFlag("workflow_pain"); S.mood = "engaged"; last = say("morgan","m_pain"); addNote("pain"); S.phase = "done"; }
    else if(v === "A"){ setFlag("premature_solution"); S.mood = "neutral"; say("narr","n_demo"); last = say("morgan","m_demo"); S.phase = "recover"; }
    else { setFlag("trust_risk"); S.mood = "guarded"; last = say("morgan","m_guard"); S.phase = "recover"; }
    focusId = last; render();
  },
  rec(){
    const v = picked("rec"); if(!v) return needPick("rec");
    S.rec = v; say("you","r_"+S.s1+v);
    let last;
    if(v === "1"){ setFlag("workflow_pain"); setFlag("recovered"); S.mood = "engaged"; last = say("morgan","m_pain"); addNote("pain"); }
    else if(S.s1 === "A"){ S.mood = "neutral"; last = say("morgan","m_sure"); }
    else { setFlag("premature_solution"); S.mood = "neutral"; say("narr","n_shortdemo"); last = say("morgan","m_okay"); }
    S.phase = "done"; focusId = last; render();
  },
  toS2(){ S.scene = 2; S.phase = "r1"; say("morgan", S.flags.workflow_pain ? "m_s2_known" : "m_s2_hidden"); goScene(2); },
  q(){
    const v = picked("q"); if(!v) return needPick("q");
    S.asked.push(v); say("you","q_"+v);
    const map = {PAIN:["workflow_pain","pain"],IMPACT:["business_impact","impact"],STAKE:["stakeholders","stake"],SUCCESS:["success_criteria","success"],FEATURE:["feature_detour",null]};
    setFlag(map[v][0]); if(map[v][1]) addNote(map[v][1]);
    S.mood = v === "FEATURE" ? "neutral" : "engaged";
    const last = say("morgan","a_"+v);
    S.phase = S.phase === "r1" ? "r2" : "done";
    focusId = last; render();
  },
  toS3(){ S.phase = "board"; goScene(3); },
  check(){
    const n = Object.keys(CARDS).filter(id=>S.board[id]).length;
    if(n < 7){ document.getElementById("board-err").hidden = false; const firstEmpty = Object.keys(CARDS).find(id=>!S.board[id]); document.querySelector(`input[name="ev-${firstEmpty}"]`).focus(); return; }
    S.boardChecked = true; focusId = "board-summary"; render(); announce(t("boardAnn")(boardScore().matches));
  },
  toS4(){ S.phase = "choose"; S.scene = 4; say("morgan","m_next"); goScene(4); },
  s4(){
    const v = picked("s4"); if(!v) return needPick("s4");
    S.s4 = v; say("you","y4_"+v);
    const st = strong(); let k;
    if(v === "B") k = st ? "m4_B_strong" : "m4_B_thin";
    else if(v === "D") k = st ? "m4_D_strong" : "m4_D_thin";
    else k = "m4_"+v;
    S.mood = (k==="m4_B_strong"||k==="m4_D_thin") ? "engaged" : (v==="A"||v==="C") ? "guarded" : "neutral";
    const last = say("morgan",k); S.phase = "justify"; focusId = last; render();
  },
  justify(){
    const sel = [...document.querySelectorAll('input[name="just"]:checked')].map(i=>i.value);
    if(sel.length > 2){ document.getElementById("just-err").hidden = false; return; }
    S.justify = sel; goScene(5);
  },
};

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act; if(!act[a]) return;
  if(b.tagName === "A") e.preventDefault();
  act[a](a==="lang" ? b.dataset.v : e);
});
document.addEventListener("change", e=>{
  const i = e.target;
  if(i.dataset && i.dataset.card){
    S.board[i.dataset.card] = i.value;
    const n = Object.keys(CARDS).filter(id=>S.board[id]).length;
    const c = document.querySelector(".counter"); if(c) c.innerHTML = `<b>${n}</b>${t("sorted")(n)}`;
    const er = document.getElementById("board-err"); if(er && n===7) er.hidden = true;
  }
  if(i.name && i.type === "radio"){ const er = document.getElementById(i.name+"-err"); if(er) er.hidden = true; }
  if(i.name === "just"){
    const sel = document.querySelectorAll('input[name="just"]:checked');
    const er = document.getElementById("just-err");
    if(sel.length > 2){ i.checked = false; if(er) er.hidden = false; } else if(er) er.hidden = true;
  }
});
document.getElementById("restart-yes").addEventListener("click", ()=>{ document.getElementById("restart-dlg").close(); act.replay(); });
